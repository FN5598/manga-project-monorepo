info:
  name: Get all mangas
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{BASE_URL}}/graphql"
  body:
    query: |-
      query MyQuery($paginationInput: PaginationInput, $sort: SortInputType, $filters: [MangaFilterTypes!]) {
      	findAllMangas(paginationInput: $paginationInput, sort: $sort, filters: $filters) {
          _id
          title
          description
          author
          status
          previewUrl
          chaptersCount
          genres {
            slug
            name
          }
          createdAt
          updatedAt
          status
        }
        countMangas(filters: $filters)
      }
    variables: |-
      {
        "paginationInput": {
          "limit": 10,
          "page": 1
        },
        "sort": {
          "sortBy": "asc",
          "field": "createdAt"
        },
        "filters": [{
          "field": "",
          "value": [""]
        }]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
